<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Concept 4: Cannabis leaf with bar chart integrated into the leaflets — data tracking theme -->
  <defs>
    <linearGradient id="grad4" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#2E7D32"/>
      <stop offset="100%" style="stop-color:#A5D6A7"/>
    </linearGradient>
  </defs>
  <!-- Bar chart bars styled as leaf segments -->
  <rect x="52" y="80" width="16" height="60" rx="3" fill="url(#grad4)" opacity="0.8"/>
  <rect x="72" y="50" width="16" height="90" rx="3" fill="url(#grad4)" opacity="0.85"/>
  <rect x="92" y="30" width="16" height="110" rx="3" fill="url(#grad4)" opacity="0.9"/>
  <rect x="112" y="55" width="16" height="85" rx="3" fill="url(#grad4)" opacity="0.85"/>
  <rect x="132" y="70" width="16" height="70" rx="3" fill="url(#grad4)" opacity="0.8"/>
  <!-- Chart baseline -->
  <line x1="45" y1="142" x2="155" y2="142" stroke="#2E7D32" stroke-width="2.5"/>
  <!-- Stem -->
  <line x1="100" y1="142" x2="100" y2="162" stroke="#2E7D32" stroke-width="3"/>
  <!-- Small leaf accent at base of stem -->
  <path d="M100,158 C95,152 88,153 86,148 C92,149 97,150 100,155Z" fill="#4CAF50"/>
  <path d="M100,158 C105,152 112,153 114,148 C108,149 103,150 100,155Z" fill="#4CAF50"/>
  <!-- Text -->
  <text x="100" y="190" text-anchor="middle" font-family="Rubik, sans-serif" font-size="22" font-weight="700" fill="#2E7D32">WEEDLOG</text>
</svg>