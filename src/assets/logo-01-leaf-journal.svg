<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Concept 1: Cannabis leaf merging into an open journal/book -->
  <defs>
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50"/>
      <stop offset="100%" style="stop-color:#2E7D32"/>
    </linearGradient>
  </defs>
  <!-- Book base -->
  <path d="M40 150 Q100 130 100 60 Q100 130 160 150 L160 160 Q100 140 100 160 Q100 140 40 160 Z" fill="#3E2723" opacity="0.8"/>
  <line x1="100" y1="60" x2="100" y2="160" stroke="#5D4037" stroke-width="1.5"/>
  <!-- Stylized cannabis leaf growing from book -->
  <g transform="translate(100,85) scale(0.7)">
    <!-- Center leaflet -->
    <path d="M0,-80 C10,-60 8,-30 0,0 C-8,-30 -10,-60 0,-80Z" fill="url(#leafGrad1)"/>
    <!-- Left leaflets -->
    <path d="M0,0 C-20,-50 -50,-70 -35,-90 C-25,-75 -15,-55 0,0Z" fill="url(#leafGrad1)"/>
    <path d="M0,0 C-30,-30 -60,-35 -55,-55 C-40,-40 -25,-30 0,0Z" fill="url(#leafGrad1)"/>
    <!-- Right leaflets -->
    <path d="M0,0 C20,-50 50,-70 35,-90 C25,-75 15,-55 0,0Z" fill="url(#leafGrad1)"/>
    <path d="M0,0 C30,-30 60,-35 55,-55 C40,-40 25,-30 0,0Z" fill="url(#leafGrad1)"/>
    <!-- Center vein -->
    <line x1="0" y1="-75" x2="0" y2="10" stroke="#1B5E20" stroke-width="1.5" opacity="0.5"/>
  </g>
  <!-- Text -->
  <text x="100" y="188" text-anchor="middle" font-family="Rubik, sans-serif" font-size="22" font-weight="700" fill="#2E7D32">WEEDLOG</text>
</svg>