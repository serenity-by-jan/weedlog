<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 07: Asterisk leaf — leaf reimagined as a 5-arm asterisk with a short stem, icon-like -->
  <g fill="none" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round">
    <!-- 5 arms at 72° intervals, rotated so one points up -->
    <line x1="100" y1="100" x2="100" y2="35"/>
    <line x1="100" y1="100" x2="162" y2="55"/>
    <line x1="100" y1="100" x2="138" y2="135"/>
    <line x1="100" y1="100" x2="62" y2="135"/>
    <line x1="100" y1="100" x2="38" y2="55"/>
    <!-- short stem hanging below -->
    <line x1="100" y1="100" x2="100" y2="165"/>
  </g>
</svg>
