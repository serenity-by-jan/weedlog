<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Concept 9: Circular badge/stamp with leaf center and text wrapping around — vintage/craft aesthetic -->
  <defs>
    <linearGradient id="grad9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43A047"/>
      <stop offset="100%" style="stop-color:#1B5E20"/>
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#2E7D32" stroke-width="4"/>
  <circle cx="100" cy="100" r="78" fill="none" stroke="#2E7D32" stroke-width="1.5"/>
  <!-- Curved text along top -->
  <path id="topArc" d="M30,100 A70,70 0 0,1 170,100" fill="none"/>
  <text font-family="Rubik, sans-serif" font-size="14" font-weight="700" fill="#2E7D32" letter-spacing="4">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">WEEDLOG</textPath>
  </text>
  <!-- Curved text along bottom -->
  <path id="bottomArc" d="M160,115 A65,65 0 0,1 40,115" fill="none"/>
  <text font-family="Rubik, sans-serif" font-size="10" font-weight="500" fill="#4CAF50" letter-spacing="2">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">EST. 2026</textPath>
  </text>
  <!-- Stars/dots as separators -->
  <circle cx="38" cy="100" r="3" fill="#4CAF50"/>
  <circle cx="162" cy="100" r="3" fill="#4CAF50"/>
  <!-- Center leaf -->
  <g transform="translate(100,98) scale(0.4)">
    <path d="M0,-80 C12,-55 10,-25 0,5 C-10,-25 -12,-55 0,-80Z" fill="url(#grad9)"/>
    <path d="M0,0 C-22,-48 -52,-68 -38,-88 C-26,-72 -14,-52 0,0Z" fill="url(#grad9)"/>
    <path d="M0,0 C-32,-28 -62,-32 -58,-52 C-42,-38 -26,-28 0,0Z" fill="url(#grad9)"/>
    <path d="M0,0 C22,-48 52,-68 38,-88 C26,-72 14,-52 0,0Z" fill="url(#grad9)"/>
    <path d="M0,0 C32,-28 62,-32 58,-52 C42,-38 26,-28 0,0Z" fill="url(#grad9)"/>
    <line x1="0" y1="5" x2="0" y2="20" stroke="#1B5E20" stroke-width="3"/>
  </g>
</svg>