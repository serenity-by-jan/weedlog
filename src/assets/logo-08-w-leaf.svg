<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Concept 8: Letter "W" with a leaf growing from the center peak — monogram style -->
  <defs>
    <linearGradient id="wGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#1B5E20"/>
      <stop offset="100%" style="stop-color:#4CAF50"/>
    </linearGradient>
  </defs>
  <!-- W letterform -->
  <path d="M30,50 L55,140 L85,80 L100,110 L115,80 L145,140 L170,50"
        fill="none" stroke="url(#wGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Small leaf growing from center top of W -->
  <g transform="translate(100,72) scale(0.3) rotate(0)">
    <path d="M0,-80 C12,-55 10,-25 0,5 C-10,-25 -12,-55 0,-80Z" fill="#4CAF50"/>
    <path d="M0,0 C-22,-48 -52,-68 -38,-88 C-26,-72 -14,-52 0,0Z" fill="#4CAF50"/>
    <path d="M0,0 C-32,-28 -62,-32 -58,-52 C-42,-38 -26,-28 0,0Z" fill="#66BB6A"/>
    <path d="M0,0 C22,-48 52,-68 38,-88 C26,-72 14,-52 0,0Z" fill="#4CAF50"/>
    <path d="M0,0 C32,-28 62,-32 58,-52 C42,-38 26,-28 0,0Z" fill="#66BB6A"/>
  </g>
  <!-- Text -->
  <text x="100" y="178" text-anchor="middle" font-family="Rubik, sans-serif" font-size="22" font-weight="700" fill="#2E7D32">WEEDLOG</text>
</svg>