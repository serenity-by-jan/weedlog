<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 07: Spread fan — fingers splay extra wide, bold & proud -->
  <g fill="none" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round">
    <line x1="100" y1="95" x2="100" y2="158"/><!-- stem -->
    <line x1="100" y1="95" x2="100" y2="30"/><!-- center -->
    <line x1="100" y1="95" x2="55" y2="38"/><!-- left inner -->
    <line x1="100" y1="95" x2="145" y2="38"/><!-- right inner -->
    <line x1="100" y1="95" x2="25" y2="70"/><!-- left outer — wide -->
    <line x1="100" y1="95" x2="175" y2="70"/><!-- right outer — wide -->
    <line x1="100" y1="95" x2="22" y2="100"/><!-- far left flare -->
    <line x1="100" y1="95" x2="178" y2="100"/><!-- far right flare -->
  </g>
</svg>
