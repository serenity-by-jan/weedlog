<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 10: Pinwheel — fingers rotated slightly like a fan/turbine, dynamic energy -->
  <g fill="none" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round">
    <line x1="100" y1="100" x2="100" y2="158"/><!-- stem -->
    <line x1="100" y1="100" x2="108" y2="30"/><!-- center, offset -->
    <line x1="100" y1="100" x2="55" y2="50"/><!-- left 1 -->
    <line x1="100" y1="100" x2="148" y2="38"/><!-- right 1, higher -->
    <line x1="100" y1="100" x2="32" y2="82"/><!-- left 2 -->
    <line x1="100" y1="100" x2="170" y2="68"/><!-- right 2 -->
  </g>
</svg>
