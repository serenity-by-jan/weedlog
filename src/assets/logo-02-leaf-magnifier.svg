<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Concept 2: Cannabis leaf inside a magnifying glass (analysis/science theme) -->
  <defs>
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#66BB6A"/>
      <stop offset="100%" style="stop-color:#388E3C"/>
    </linearGradient>
  </defs>
  <!-- Magnifying glass handle -->
  <line x1="135" y1="135" x2="175" y2="175" stroke="#5D4037" stroke-width="12" stroke-linecap="round"/>
  <!-- Magnifying glass circle -->
  <circle cx="90" cy="90" r="60" fill="none" stroke="#5D4037" stroke-width="8"/>
  <circle cx="90" cy="90" r="55" fill="#E8F5E9" opacity="0.3"/>
  <!-- Leaf inside magnifier -->
  <g transform="translate(90,85) scale(0.55)">
    <path d="M0,-80 C12,-55 10,-25 0,5 C-10,-25 -12,-55 0,-80Z" fill="url(#leafGrad2)"/>
    <path d="M0,0 C-22,-48 -52,-68 -38,-88 C-26,-72 -14,-52 0,0Z" fill="url(#leafGrad2)"/>
    <path d="M0,0 C-32,-28 -62,-32 -58,-52 C-42,-38 -26,-28 0,0Z" fill="url(#leafGrad2)"/>
    <path d="M0,0 C22,-48 52,-68 38,-88 C26,-72 14,-52 0,0Z" fill="url(#leafGrad2)"/>
    <path d="M0,0 C32,-28 62,-32 58,-52 C42,-38 26,-28 0,0Z" fill="url(#leafGrad2)"/>
    <line x1="0" y1="5" x2="0" y2="20" stroke="#388E3C" stroke-width="3"/>
  </g>
  <!-- Small data points/dots to suggest analysis -->
  <circle cx="68" cy="110" r="2" fill="#388E3C" opacity="0.6"/>
  <circle cx="78" cy="118" r="2" fill="#388E3C" opacity="0.6"/>
  <circle cx="105" cy="115" r="2" fill="#388E3C" opacity="0.6"/>
  <!-- Text -->
  <text x="100" y="195" text-anchor="middle" font-family="Rubik, sans-serif" font-size="20" font-weight="700" fill="#388E3C">WEEDLOG</text>
</svg>