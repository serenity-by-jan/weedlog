<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 11: Stacked chevrons — leaf implied by stacked V shapes pointing up -->
  <g fill="none" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="100" y1="100" x2="100" y2="160"/><!-- stem -->
    <polyline points="60,90 100,55 140,90"/><!-- top chevron -->
    <polyline points="50,110 100,75 150,110"/><!-- middle chevron -->
    <polyline points="68,120 100,95 132,120"/><!-- bottom chevron, tighter -->
  </g>
</svg>
