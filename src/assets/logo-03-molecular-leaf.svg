  </defs>
  <!-- Molecular bonds -->
  <line x1="100" y1="30" x2="100" y2="65" stroke="#4CAF50" stroke-width="2.5" opacity="0.7"/>
  <line x1="100" y1="65" x2="65" y2="90" stroke="#4CAF50" stroke-width="2.5" opacity="0.7"/>
  <line x1="100" y1="65" x2="135" y2="90" stroke="#4CAF50" stroke-width="2.5" opacity="0.7"/>
  <line x1="65" y1="90" x2="50" y2="125" stroke="#4CAF50" stroke-width="2.5" opacity="0.7"/>
  <line x1="65" y1="90" x2="85" y2="120" stroke="#4CAF50" stroke-width="2.5" opacity="0.7"/>
  <line x1="135" y1="90" x2="150" y2="125" stroke="#4CAF50" stroke-width="2.5" opacity="0.7"/>
  <line x1="135" y1="90" x2="115" y2="120" stroke="#4CAF50" stroke-width="2.5" opacity="0.7"/>
