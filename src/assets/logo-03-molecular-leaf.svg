  <circle cx="115" cy="120" r="7" fill="url(#grad3)"/>
  <circle cx="100" cy="150" r="9" fill="url(#grad3)"/>
  <!-- Stem -->
  <line x1="100" y1="150" x2="100" y2="170" stroke="#2E7D32" stroke-width="3"/>
