<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Concept 6: Cannabis leaf + terpene droplet — emphasizing the terpene/chemistry angle -->
  <defs>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFC107"/>
      <stop offset="100%" style="stop-color:#FF9800"/>
    </linearGradient>
    <linearGradient id="leafGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#66BB6A"/>
      <stop offset="100%" style="stop-color:#2E7D32"/>
    </linearGradient>
  </defs>
  <!-- Large droplet shape -->
  <path d="M100,25 C100,25 140,80 140,110 C140,132 122,150 100,150 C78,150 60,132 60,110 C60,80 100,25 100,25Z" fill="url(#dropGrad)" opacity="0.2"/>
  <path d="M100,25 C100,25 140,80 140,110 C140,132 122,150 100,150 C78,150 60,132 60,110 C60,80 100,25 100,25Z" fill="none" stroke="#FF9800" stroke-width="2.5"/>
  <!-- Cannabis leaf inside the droplet -->
  <g transform="translate(100,95) scale(0.45)">
    <path d="M0,-80 C12,-55 10,-25 0,5 C-10,-25 -12,-55 0,-80Z" fill="url(#leafGrad6)"/>
    <path d="M0,0 C-22,-48 -52,-68 -38,-88 C-26,-72 -14,-52 0,0Z" fill="url(#leafGrad6)"/>
    <path d="M0,0 C-32,-28 -62,-32 -58,-52 C-42,-38 -26,-28 0,0Z" fill="url(#leafGrad6)"/>
    <path d="M0,0 C22,-48 52,-68 38,-88 C26,-72 14,-52 0,0Z" fill="url(#leafGrad6)"/>
    <path d="M0,0 C32,-28 62,-32 58,-52 C42,-38 26,-28 0,0Z" fill="url(#leafGrad6)"/>
    <line x1="0" y1="5" x2="0" y2="25" stroke="#2E7D32" stroke-width="3"/>
  </g>
  <!-- Text -->
  <text x="100" y="185" text-anchor="middle" font-family="Rubik, sans-serif" font-size="22" font-weight="700" fill="#2E7D32">WEEDLOG</text>
</svg>