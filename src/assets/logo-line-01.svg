<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 01: Classic five-finger — 5 bold lines radiating from stem, simplest possible leaf -->
  <g fill="none" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="100" y1="95" x2="100" y2="150"/><!-- stem -->
    <line x1="100" y1="95" x2="100" y2="30"/><!-- center -->
    <line x1="100" y1="95" x2="65" y2="42"/><!-- inner left -->
    <line x1="100" y1="95" x2="135" y2="42"/><!-- inner right -->
    <line x1="100" y1="95" x2="42" y2="65"/><!-- outer left -->
    <line x1="100" y1="95" x2="158" y2="65"/><!-- outer right -->
  </g>
</svg>
