<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 09: Crosshatch leaf — simple leaf outline with a single crosshatch line for texture -->
  <g fill="none" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100,160 L100,95"/>
    <path d="M100,95 L100,30"/>
    <path d="M100,95 L55,42"/>
    <path d="M100,95 L145,42"/>
    <path d="M100,95 L35,70"/>
    <path d="M100,95 L165,70"/>
    <!-- single bold cross-stroke for character -->
    <line x1="55" y1="72" x2="145" y2="72"/>
  </g>
</svg>
