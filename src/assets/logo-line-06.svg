<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 06: Asymmetric playful — uneven finger lengths, tilted, hand-drawn feel -->
  <g fill="none" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-12, 100, 100)">
    <line x1="100" y1="98" x2="100" y2="160"/><!-- stem -->
    <line x1="100" y1="98" x2="96" y2="28"/><!-- center, slightly off -->
    <line x1="100" y1="98" x2="58" y2="48"/><!-- left inner, shorter -->
    <line x1="100" y1="98" x2="140" y2="36"/><!-- right inner, longer -->
    <line x1="100" y1="98" x2="44" y2="72"/><!-- left outer, short -->
    <line x1="100" y1="98" x2="164" y2="58"/><!-- right outer, longer -->
  </g>
</svg>
