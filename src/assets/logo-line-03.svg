<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 03: Three-finger minimal — just 3 leaflets + stem, ultra simplified -->
  <g fill="none" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <line x1="100" y1="100" x2="100" y2="160"/><!-- stem -->
    <line x1="100" y1="100" x2="100" y2="32"/><!-- center finger -->
    <line x1="100" y1="100" x2="52" y2="52"/><!-- left finger -->
    <line x1="100" y1="100" x2="148" y2="52"/><!-- right finger -->
  </g>
</svg>
